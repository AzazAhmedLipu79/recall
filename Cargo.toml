[workspace]
resolver = "2"
members = [
    "crates/recall-core",
    "crates/recall-db",
    "crates/recall-storage",
    "crates/recall-hash",
    "crates/recall-metadata",
    "crates/recall-importer",
    "crates/recall-verify",
    "crates/recall-backup",
    "crates/recallctl",
    "crates/recall-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["recall contributors"]

[workspace.dependencies]
# Internal
recall-core = { path = "crates/recall-core" }
recall-db = { path = "crates/recall-db" }
recall-storage = { path = "crates/recall-storage" }
recall-hash = { path = "crates/recall-hash" }
recall-metadata = { path = "crates/recall-metadata" }
recall-importer = { path = "crates/recall-importer" }
recall-verify = { path = "crates/recall-verify" }
recall-backup = { path = "crates/recall-backup" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
walkdir = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rayon = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
indicatif = "0.17"
tempfile = "3"
camino = { version = "1", features = ["serde1"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
